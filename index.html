<!DOCTYPE html>
<!--
TRACTOR HISHOB - single file (login + cloud sync + WhatsApp message)

SETUP (one time):
1. console.firebase.google.com -> project -> Build -> Authentication -> Sign-in method -> Email/Password -> Enable
2. Build -> Firestore Database -> Create database -> Rules tab -> paste this and Publish:

   rules_version = '2';
   service cloud.firestore {
     match /databases/{database}/documents {
       match /users/{uid}/{document=**} {
         allow read, write: if request.auth != null && request.auth.uid == uid;
       }
     }
   }

3. Project settings -> Your apps -> Web app -> copy firebaseConfig and paste it in
   FIREBASE_CONFIG below (search "FIREBASE_CONFIG" in this file).
4. Authentication -> Settings -> Authorized domains -> add the domain where this file is hosted.
5. Host this file as index.html (Firebase Hosting / any HTTPS hosting).
   Until FIREBASE_CONFIG is filled, the app works in local-only mode (no login).
-->
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ट्रॅक्टर हिशोब</title>
<style>
:root{--bg:#eef1e8;--card:#fff;--ink:#1d2a20;--mut:#5d6b60;--g:#2f5d3a;--y:#e0a100;--red:#b3361f;--line:#d5dccb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b15;--card:#1e281f;--ink:#e8eee6;--mut:#9fb0a2;--g:#6fb583;--line:#2f3d31;--red:#ef7a62}}
:root[data-theme="dark"]{--bg:#141b15;--card:#1e281f;--ink:#e8eee6;--mut:#9fb0a2;--g:#6fb583;--line:#2f3d31;--red:#ef7a62}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans Devanagari","Noto Naskh Arabic","Noto Sans Ol Chiki","Noto Sans Meetei Mayek","Noto Sans",system-ui,sans-serif;max-width:560px;margin:auto;padding:14px}
h1{font-size:21px;font-weight:800;margin:4px 0}
.top{display:flex;justify-content:space-between;align-items:center}
.lb{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit}
.tabs{display:flex;gap:8px;margin:10px 0 12px}
.tabs button{flex:1;padding:11px 4px;font-size:15px;border:2px solid var(--g);background:none;color:var(--g);border-radius:10px;font-family:inherit;font-weight:600}
.tabs button.on{background:var(--g);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-size:14px;color:var(--mut);margin:8px 0 3px}
input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--bg);color:var(--ink)}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{width:100%;margin-top:12px;padding:13px;border:0;border-radius:10px;background:var(--y);color:#1d1a0b;font:inherit;font-weight:800;font-size:17px}
.tot{font-weight:800;color:var(--g);margin-top:8px}
.it{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.it:first-child{border-top:0}.sm{font-size:13px;color:var(--mut)}
.due{color:var(--red);font-weight:800;white-space:nowrap}.ok{color:var(--g);font-weight:800}
.x{background:none;border:0;color:var(--mut);font-size:18px}
.big{font-size:26px;font-weight:800;color:var(--red)}
.cp{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px}
.dr{cursor:pointer}.cg{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px}.gh{display:flex;justify-content:space-between;gap:8px;padding-bottom:4px}.ent{align-items:center}
[data-cust]{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.ov[hidden],#sp[hidden],#lg[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet .btn{margin-top:8px}.b2{background:none!important;border:1px solid var(--line)!important;color:var(--ink)!important}.b3{background:none!important;border:1px solid var(--red)!important;color:var(--red)!important}
#sp{position:fixed;inset:0;z-index:20;background:#0d3b1a;overflow:hidden}
#sp img{width:100%;height:100%;object-fit:cover;object-position:50% 50%;display:block}
.tr{width:min(66vw,300px);height:auto;animation:bob 1.1s ease-in-out infinite}
.wh{animation:r 1.6s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes sl{0%{margin-left:-40%}100%{margin-left:100%}}
@media (prefers-reduced-motion:reduce){.tr,.wh,.sp-bar i{animation:none}.sp-bar i{width:100%}}
#lo{position:fixed;inset:0;z-index:16;background:var(--bg);overflow:auto;padding:calc(30px + env(safe-area-inset-top,0px)) 18px 20px}#lo[hidden]{display:none}#lof{max-width:420px;margin:auto}#lg{position:fixed;inset:0;z-index:15;background:var(--bg);overflow:auto;padding:20px 14px}
#lg .g{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:560px;margin:12px auto}
#lg button{padding:14px 6px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:17px}
:focus-visible{outline:3px solid var(--y);outline-offset:2px}

/* ---- new look: green + gold ---- */
:root{--bg:#f4f2e4;--card:#fff;--ink:#1b2a1f;--mut:#66725f;--g:#15613a;--y:#f5b800;--red:#c0392b;--line:#e4e1cd}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a11;--card:#17241a;--ink:#e9f0e6;--mut:#9db1a0;--g:#5fc17f;--line:#27382b;--red:#f08a74}}
:root[data-theme="dark"]{--bg:#0e1a11;--card:#17241a;--ink:#e9f0e6;--mut:#9db1a0;--g:#5fc17f;--line:#27382b;--red:#f08a74}
body{padding-top:0}
.top{background:linear-gradient(135deg,#0d4a28 0%,#1f7a3d 100%);color:#fff;margin:0 -14px 14px;padding:18px 18px 22px;border-radius:0 0 26px 26px;box-shadow:0 6px 18px rgba(13,74,40,.25)}
.top h1{color:#fff;font-size:22px;margin:0 auto 0 12px;letter-spacing:.2px;flex:1}
.top .lb{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:50%;width:42px;height:42px;padding:0;font-size:18px}
.tabs{background:var(--card);padding:5px;border-radius:16px;border:1px solid var(--line);gap:4px;box-shadow:0 2px 8px rgba(20,60,30,.06)}
.tabs button{border:0;border-radius:12px;color:var(--mut)}
.tabs button.on{background:linear-gradient(135deg,#15613a,#1f7a3d);color:#fff;box-shadow:0 3px 8px rgba(21,97,58,.3)}
.card{border-radius:18px;box-shadow:0 2px 12px rgba(20,60,30,.07);padding:16px}
input,select{border-radius:12px;border:1.5px solid var(--line);padding:12px}
input:focus,select:focus{outline:0;border-color:var(--g);box-shadow:0 0 0 3px rgba(31,122,61,.18)}
.btn{background:linear-gradient(180deg,#ffd23f,#f2a900);color:#2a2000;border-radius:14px;box-shadow:0 5px 14px rgba(245,184,0,.35)}
.btn:active{transform:translateY(1px)}
.cg{border-radius:14px;background:var(--bg);border-color:transparent}
.sheet{border-radius:22px 22px 0 0}
#lo{background:linear-gradient(165deg,#0d4a28 0%,#1f7a3d 65%,#2f8f4b 100%)}
#lo h1{color:#fff}#lof>.sm{color:#d9eddc}
#lo .card{box-shadow:0 10px 30px rgba(0,0,0,.25)}
#bkk{position:relative;z-index:12}
#lg{z-index:18}
#lg h1{margin:6px 0}
#lgb{margin-right:6px}

/* ---- professional polish ---- */
.tt{flex:1;margin:0 10px;min-width:0}
.top h1{flex:none;margin:0;font-size:21px;line-height:1.2}
#hgreet{font-size:13px;color:rgba(255,255,255,.85);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;font-size:13px;line-height:1.25}
.tabs button::before{font-size:19px}
#t1::before{content:"🌾"}#t2::before{content:"📒"}#t3::before{content:"⛽"}
label{font-weight:600;font-size:13px;color:var(--mut);letter-spacing:.2px}
.brand{text-align:center;margin:6px 0 18px}
.brand h1{color:#fff;margin:10px 0 4px;font-size:26px}
.brand .sm{color:#d9eddc;max-width:320px;margin:0 auto;line-height:1.5}
.logo{width:84px;height:84px;border-radius:26px;margin:0 auto;display:grid;place-items:center;font-size:44px;background:linear-gradient(135deg,#ffd23f,#f2a900);box-shadow:0 10px 26px rgba(0,0,0,.28)}
.seg{display:flex;background:var(--bg);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:transparent;color:var(--mut);font-weight:700;font-size:15px;padding:10px;border-radius:11px;font-family:inherit}
.seg button.on{background:var(--card);color:var(--g);box-shadow:0 2px 8px rgba(20,60,30,.14)}
.pw{position:relative}
.pw input{padding-right:48px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;font-size:20px;padding:8px;line-height:1}
#lo .card{padding:20px 18px;border-radius:22px}
.prof{display:flex;align-items:center;gap:14px}
#av{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:700;color:#fff;background:linear-gradient(135deg,#15613a,#1f7a3d);flex:none}
.prof b{font-size:17px;display:block}
</style>
</head>

  var er=function(e){stErr=String((e&&e.code)||"error");setSt()},op={includeMetadataChanges:true};
  unsubs=[base.collection("d").onSnapshot(op,onSnap("d"),er),base.collection("x").onSnapshot(op,onSnap("x"),er),base.onSnapshot(op,onSnap("s"),er)]}
function stopSync(){unsubs.forEach(function(f){try{f()}catch(e){}});unsubs=[];base=null;started=false}
function syncUp(){
  if(!CLOUD||!base)return;
  if(!started){pre=true;return}
  var ops=[],cd={},cx={},k;
  D.forEach(function(e){k=String(e.id);cd[k]=1;var s=stab(e);if(cloud.d[k]!==s)ops.push({t:"set",c:"d",k:k,v:e,s:s})});
  for(k in cloud.d){if(!cd[k])ops.push({t:"del",c:"d",k:k})}
  X.forEach(function(e){k=String(e.id);cx[k]=1;var s=stab(e);if(cloud.x[k]!==s)ops.push({t:"set",c:"x",k:k,v:e,s:s})});
  for(k in cloud.x){if(!cx[k])ops.push({t:"del",c:"x",k:k})}
  var ss=setStr();if(ss!==cloud.s)ops.push({t:"set",c:"s",v:JSON.parse(ss),s:ss});
  if(!ops.length)return;
  for(var i=0;i<ops.length;i+=400){
    var b=firebase.firestore().batch();
    ops.slice(i,i+400).forEach(function(o){var r=o.c==="s"?base:base.collection(o.c).doc(o.k);
      if(o.t==="del")b.delete(r);else b.set(r,JSON.parse(JSON.stringify(o.v)))});
    b.commit().catch(function(e){stErr=String((e&&e.code)||"error");setSt()})}
  ops.forEach(function(o){if(o.c==="s")cloud.s=o.s;else if(o.t==="del")delete cloud[o.c][o.k];else cloud[o.c][o.k]=o.s});
  PW.d=PW.x=PW.s=true;setSt()}

/* login screen */
var lmode=1,curU=null;

function aerr(x){var c=(x&&x.code)||"";

  if(c==="auth/user-not-found"||c==="auth/wrong-password"||c==="auth/invalid-credential"||c==="auth/invalid-login-credentials")return t("e_cred");
  if(c==="auth/email-already-in-use")return t("e_exist");
  if(c==="auth/weak-password")return t("e_weak");
  if(c==="auth/network-request-failed")return t("e_net");
  if(c==="auth/too-many-requests")return t("e_many");
  return t("e_other")+(c||(x&&x.message)||"")}
